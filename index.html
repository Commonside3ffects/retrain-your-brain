<style>
/* Layout: Material 3 navigation rail beside one scrolling pane of filled cards; under 600px the rail becomes a navigation bar with a floating action button. */
:root{
  --md-primary: #116b57; --md-on-primary: #ffffff; --md-primary-container: #a3f2d8; --md-on-primary-container: #005140; --md-secondary: #4b635b; --md-on-secondary: #ffffff; --md-secondary-container: #cee9dd; --md-on-secondary-container: #344c43; --md-tertiary: #416276; --md-on-tertiary: #ffffff; --md-tertiary-container: #c4e7ff; --md-on-tertiary-container: #284b5e; --md-error: #ba1a1a; --md-on-error: #ffffff; --md-error-container: #ffdad6; --md-on-error-container: #93000a; --md-surface: #f5fbf6; --md-on-surface: #171d1a; --md-surface-variant: #dbe5df; --md-on-surface-variant: #3f4945; --md-outline: #6f7975; --md-outline-variant: #bfc9c3; --md-scrim: #000000; --md-inverse-surface: #2b322f; --md-inverse-on-surface: #ecf2ee; --md-inverse-primary: #87d6bd; --md-surface-container-lowest: #ffffff; --md-surface-container-low: #eff5f1; --md-surface-container: #e9efeb; --md-surface-container-high: #e3eae5; --md-surface-container-highest: #dee4e0;
  --font-brand:'Roboto Serif',Georgia,'Times New Roman',serif;
  --font-plain:'Roboto Flex',Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;
  --shape-xs:4px; --shape-sm:8px; --shape-md:12px; --shape-lg:16px; --shape-xl:28px; --shape-full:999px;
  --elev-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --elev-2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);
  --elev-3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  --rail-w:88px; --bar-h:80px;
  --fs:16px; --lh:24px; --pad:24px; --gap:20px; --stack:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --md-primary: #87d6bd; --md-on-primary: #00382c; --md-primary-container: #005140; --md-on-primary-container: #a3f2d8; --md-secondary: #b2ccc2; --md-on-secondary: #1d352d; --md-secondary-container: #344c43; --md-on-secondary-container: #cee9dd; --md-tertiary: #a8cbe2; --md-on-tertiary: #0e3446; --md-tertiary-container: #284b5e; --md-on-tertiary-container: #c4e7ff; --md-error: #ffb4ab; --md-on-error: #690005; --md-error-container: #93000a; --md-on-error-container: #ffdad6; --md-surface: #0f1512; --md-on-surface: #dee4e0; --md-surface-variant: #3f4945; --md-on-surface-variant: #bfc9c3; --md-outline: #89938e; --md-outline-variant: #3f4945; --md-scrim: #000000; --md-inverse-surface: #dee4e0; --md-inverse-on-surface: #2b322f; --md-inverse-primary: #116b57; --md-surface-container-lowest: #090f0d; --md-surface-container-low: #171d1a; --md-surface-container: #1b211e; --md-surface-container-high: #252b29; --md-surface-container-highest: #303633;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --md-primary: #87d6bd; --md-on-primary: #00382c; --md-primary-container: #005140; --md-on-primary-container: #a3f2d8; --md-secondary: #b2ccc2; --md-on-secondary: #1d352d; --md-secondary-container: #344c43; --md-on-secondary-container: #cee9dd; --md-tertiary: #a8cbe2; --md-on-tertiary: #0e3446; --md-tertiary-container: #284b5e; --md-on-tertiary-container: #c4e7ff; --md-error: #ffb4ab; --md-on-error: #690005; --md-error-container: #93000a; --md-on-error-container: #ffdad6; --md-surface: #0f1512; --md-on-surface: #dee4e0; --md-surface-variant: #3f4945; --md-on-surface-variant: #bfc9c3; --md-outline: #89938e; --md-outline-variant: #3f4945; --md-scrim: #000000; --md-inverse-surface: #dee4e0; --md-inverse-on-surface: #2b322f; --md-inverse-primary: #116b57; --md-surface-container-lowest: #090f0d; --md-surface-container-low: #171d1a; --md-surface-container: #1b211e; --md-surface-container-high: #252b29; --md-surface-container-highest: #303633;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--md-surface);color:var(--md-on-surface);font:400 14px/20px var(--font-plain);letter-spacing:.25px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ol,ul{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--md-primary);outline-offset:2px}

/* Material Symbols */
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex:none;width:1em;height:1em;overflow:hidden;user-select:none}
.appicon{display:block;flex:none}

/* ---------- App shell ---------- */
.app{display:flex;height:100%}
.main{flex:1;min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.content{max-width:872px;margin-inline:auto;padding-inline:24px;padding-block:8px 96px}
.content.wide{max-width:1120px}

/* Navigation rail */
.rail{flex:none;width:var(--rail-w);height:100%;background:var(--md-surface-container);display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:16px 12px;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-logo{border:0;background:none;padding:0;border-radius:12px;cursor:pointer}
.rail-logo .appicon{width:44px;height:44px}
.rail-items{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:4px}
.nav-item{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;color:var(--md-on-surface-variant);font:500 12px/16px var(--font-plain);letter-spacing:.5px}
.nav-ind{position:relative;width:56px;height:32px;border-radius:var(--shape-lg);display:grid;place-items:center;transition:background .2s}
.nav-item:hover .nav-ind{background:color-mix(in srgb,var(--md-on-surface) 8%,transparent)}
.nav-item[aria-current="page"]{color:var(--md-on-surface);font-weight:700}
.nav-item[aria-current="page"] .nav-ind{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.nav-item[aria-current="page"] .ms{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.nav-badge{position:absolute;top:2px;right:8px;width:14px;height:14px;border-radius:50%;background:var(--md-tertiary);color:var(--md-on-tertiary);display:grid;place-items:center}
.nav-badge .ms{font-size:11px;font-variation-settings:'FILL' 0,'wght' 700,'GRAD' 0,'opsz' 20}

/* Navigation bar (compact) */
.navbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--md-surface-container);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbar-in{display:flex;height:var(--bar-h);align-items:center}
.navbar .nav-item{flex:1;gap:4px}
.navbar .nav-ind{width:64px}
.navbar .nav-badge{right:12px}

/* FABs */
.fab{border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;min-width:56px;padding:0;border-radius:var(--shape-lg);background:var(--md-primary-container);color:var(--md-on-primary-container);font:500 14px/20px var(--font-plain);letter-spacing:.1px;position:relative;transition:box-shadow .2s}
.fab::after,.btn::after,.icon-btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none}
.fab:hover::after,.btn:hover::after,.icon-btn:hover::after{opacity:.08}
.fab:active::after,.btn:active::after,.icon-btn:active::after{opacity:.12}
.fab-rail{box-shadow:none}
.fab-ext{display:none;position:fixed;right:16px;bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 20px 0 16px;box-shadow:var(--elev-3)}

/* Top app bar */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;height:64px;padding-inline:24px 16px;background:var(--md-surface);transition:background .2s}
.main.scrolled .topbar{background:var(--md-surface-container)}
.topbar .appicon{width:32px;height:32px;display:none}
.topbar-title{flex:1;min-width:0;font:400 22px/28px var(--font-brand);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-state{display:inline-flex;align-items:center;gap:6px;font:500 12px/16px var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant);white-space:nowrap}
.save-state .ms{font-size:18px;color:var(--md-primary)}
.icon-btn{position:relative;border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--md-on-surface-variant);flex:none}

/* ---------- Buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border:0;border-radius:var(--shape-full);font:500 14px/20px var(--font-plain);letter-spacing:.1px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn .ms{font-size:18px}
.btn.has-ic{padding-left:16px}
.btn.filled{background:var(--md-primary);color:var(--md-on-primary)}
.btn.tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.btn.outlined{background:transparent;color:var(--md-primary);box-shadow:inset 0 0 0 1px var(--md-outline)}
.btn.text{background:transparent;color:var(--md-primary);padding:0 12px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- Cards ---------- */
.stack{display:flex;flex-direction:column;gap:var(--stack);min-width:0}
.card{background:var(--md-surface-container-low);border-radius:var(--shape-md);padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.card.outlined{background:var(--md-surface);border:1px solid var(--md-outline-variant)}
.card-h{display:flex;align-items:center;gap:16px}
.card-ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--md-primary-container);color:var(--md-on-primary-container);display:grid;place-items:center}
.card-ic .ms{font-size:22px}
.card-h h2{font:400 22px/28px var(--font-brand);letter-spacing:0;text-wrap:balance}
.card-sub{font:400 14px/20px var(--font-plain);color:var(--md-on-surface-variant);margin-top:2px}
.card-b{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.body{font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant);max-width:68ch}
.body b,.prompt b{font-weight:600;color:var(--md-on-surface)}
.q{display:flex;flex-direction:column;gap:8px;min-width:0}
.prompt{font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface);max-width:68ch}
.subsec{display:flex;flex-direction:column;gap:16px;padding-top:var(--gap);border-top:1px solid var(--md-outline-variant);min-width:0}
.sub-h{display:flex;align-items:center;gap:8px;font:500 16px/24px var(--font-plain);letter-spacing:.15px}
.sub-h .ms{font-size:20px;color:var(--md-primary)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cols2>*{min-width:0}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--shape-md);background:var(--md-secondary-container);color:var(--md-on-secondary-container);font:400 14px/20px var(--font-plain)}
.note.tertiary{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.note .ms{font-size:20px;margin-top:0}
.note b{font-weight:600}
.steps{padding-left:22px;display:flex;flex-direction:column;gap:6px;font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px;max-width:68ch}
.steps li::marker{color:var(--md-primary);font-weight:600}
.plain-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;font:400 14px/20px var(--font-plain)}
.plain-list li{display:flex;gap:10px;align-items:flex-start}
.plain-list .ms{font-size:18px;color:var(--md-primary);margin-top:1px}

/* ---------- Text fields (filled) ---------- */
.tf{position:relative;display:block;min-width:0;background:var(--md-surface-container-highest);border-radius:4px 4px 0 0;box-shadow:inset 0 -1px 0 var(--md-on-surface-variant);transition:box-shadow .15s}
.tf:hover{box-shadow:inset 0 -1px 0 var(--md-on-surface)}
.tf:focus-within{box-shadow:inset 0 -2px 0 var(--md-primary)}
.tf input,.tf textarea{display:block;width:100%;border:0;outline:0;background:transparent;color:var(--md-on-surface);font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px;padding:24px 16px 8px;caret-color:var(--md-primary);resize:none;border-radius:inherit}
.tf textarea{overflow:hidden}
.tf input,.tf textarea,input.cf,textarea.cf{font-size:max(16px,var(--fs))}
.tf label{position:absolute;left:16px;right:16px;top:16px;font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant);pointer-events:none;transition:top .15s,font-size .15s,line-height .15s,color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf :focus + label,.tf :not(:placeholder-shown) + label{top:6px;font-size:12px;line-height:16px;letter-spacing:.4px}
.tf :focus + label{color:var(--md-primary)}
/* compact outlined field for rows */
.cf{display:block;width:100%;min-width:0;height:40px;border:0;outline:0;border-radius:var(--shape-xs);background:transparent;box-shadow:inset 0 0 0 1px var(--md-outline);color:var(--md-on-surface);font:400 var(--fs)/var(--lh) var(--font-plain);padding:0 12px;caret-color:var(--md-primary)}
.cf::placeholder{color:var(--md-on-surface-variant);opacity:.8}
.cf:hover{box-shadow:inset 0 0 0 1px var(--md-on-surface)}
.cf:focus{box-shadow:inset 0 0 0 2px var(--md-primary)}
textarea.cf{height:auto;padding:8px 12px;resize:none;overflow:hidden}
input[type=number].cf{-moz-appearance:textfield;appearance:textfield;font-variant-numeric:tabular-nums}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- Checkbox ---------- */
.checks{display:flex;flex-direction:column}
.check{position:relative;display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer;font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px}
.check input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.box{flex:none;width:18px;height:18px;margin:3px;border:2px solid var(--md-on-surface-variant);border-radius:2px;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.box .ms{font-size:16px;font-variation-settings:'FILL' 0,'wght' 700,'GRAD' 0,'opsz' 20}
.check input:checked + .box{background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary)}
.check input:focus-visible + .box{outline:2px solid var(--md-primary);outline-offset:2px}
.check.bare{padding:0}

/* ---------- Chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip-in{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px;border:1px solid var(--md-outline-variant);border-radius:var(--shape-sm);font:500 14px/20px var(--font-plain);letter-spacing:.1px;color:var(--md-on-surface-variant);white-space:nowrap}
.chip-in .ms{font-size:18px}
.chip .chip-in>.ms{display:none}
.chip input:checked + .chip-in{background:var(--md-secondary-container);border-color:transparent;color:var(--md-on-secondary-container);padding-left:8px}
.chip input:checked + .chip-in>.ms{display:inline-block}
.chip input:focus-visible + .chip-in{outline:2px solid var(--md-primary);outline-offset:2px}
.chip-in.on{background:var(--md-secondary-container);border-color:transparent;color:var(--md-on-secondary-container)}
.chip-in.done{background:var(--md-tertiary-container);border-color:transparent;color:var(--md-on-tertiary-container);padding-left:8px}
.chip-in b{font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Segmented button ---------- */
.seg{display:inline-flex;height:40px;border-radius:var(--shape-full);box-shadow:inset 0 0 0 1px var(--md-outline);overflow:hidden;flex:none}
.seg label{position:relative;cursor:pointer;display:block}
.seg label+label{border-left:1px solid var(--md-outline)}
.seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg label>span{display:flex;align-items:center;justify-content:center;gap:4px;height:40px;min-width:44px;padding:0 10px;font:500 14px/20px var(--font-plain);color:var(--md-on-surface);font-variant-numeric:tabular-nums}
.seg label>span .ms{display:none;font-size:16px}
.seg input:checked + span{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.seg input:checked + span .ms{display:inline-block}
.seg input:focus-visible + span{outline:2px solid var(--md-primary);outline-offset:-3px}

/* ---------- Progress ---------- */
.lin{height:4px;border-radius:2px;background:var(--md-secondary-container);overflow:hidden}
.lin-fill{height:100%;width:0;background:var(--md-primary);border-radius:2px;transition:width .3s}

/* ---------- Page header / footer ---------- */
.ph{display:flex;flex-direction:column;gap:8px;padding-block:8px 8px}
.eyebrow{font:500 12px/16px var(--font-plain);letter-spacing:1px;text-transform:uppercase;color:var(--md-primary)}
.ph h1{font:400 36px/44px var(--font-brand);letter-spacing:0;text-wrap:balance}
.ph-intro{font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant);max-width:65ch}
.ph-prog{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.ph-prog .lin{flex:1;min-width:120px}
.ph-prog span.t{font:500 12px/16px var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant);font-variant-numeric:tabular-nums;white-space:nowrap}
.pf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px}
.fin{background:var(--md-primary-container);color:var(--md-on-primary-container);align-items:flex-start}
.fin h2{font:400 28px/36px var(--font-brand)}
.fin blockquote{margin:0;font:italic 400 16px/24px var(--font-brand);max-width:60ch}
.fin cite{display:block;margin-top:6px;font:500 12px/16px var(--font-plain);font-style:normal;letter-spacing:.5px}

/* ---------- Accordion + entries ---------- */
.acc-group{display:flex;flex-direction:column;gap:8px}
details.acc,details.entry{border:1px solid var(--md-outline-variant);border-radius:var(--shape-md);background:var(--md-surface);min-width:0}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:var(--shape-md);font:500 16px/24px var(--font-plain);letter-spacing:.15px}
summary::-webkit-details-marker{display:none}
summary>span:first-child{flex:none}
summary .ms{margin-left:auto;color:var(--md-on-surface-variant);transition:transform .2s}
details[open]>summary .ms{transform:rotate(180deg)}
.acc-b,.entry-b{display:flex;flex-direction:column;gap:16px;padding:4px 16px 16px;min-width:0}
.entry-m{flex:1;min-width:0;font:400 14px/20px var(--font-plain);color:var(--md-on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entries{display:flex;flex-direction:column;gap:12px;min-width:0}
.entry-flat{border:1px solid var(--md-outline-variant);border-radius:var(--shape-md);background:var(--md-surface);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.entry-t{font:500 12px/16px var(--font-plain);letter-spacing:1px;text-transform:uppercase;color:var(--md-on-surface-variant)}

/* daily activities rows */
.arow{display:grid;grid-template-columns:96px minmax(0,1fr) 104px 104px;gap:8px;align-items:end}
.arow-h{font:500 12px/16px var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant)}
.arow-h span{padding-left:2px}
.arows{display:flex;flex-direction:column;gap:8px}
.af{display:block;min-width:0}
.af>span{display:none;font:500 11px/16px var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant);margin:0 0 2px 2px}
.mood{display:grid;grid-template-columns:auto minmax(0,1fr) 76px;gap:16px;align-items:center;font:500 14px/20px var(--font-plain)}
.mood output{font:500 14px/20px var(--font-plain);color:var(--md-primary);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--md-secondary-container)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--md-secondary-container)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--md-primary);border:0;margin-top:-8px;box-shadow:var(--elev-1)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--md-primary);border:0;box-shadow:var(--elev-1)}

/* thought flow */
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.flow-a{color:var(--md-outline);display:grid;place-items:center}

/* rows */
.plan-rows{display:flex;flex-direction:column;gap:12px}
.prow{display:grid;grid-template-columns:auto minmax(0,1.7fr) minmax(0,1fr);gap:12px;align-items:center}
.vrows,.xrows{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.xrow{display:grid;grid-template-columns:24px minmax(0,1fr) 88px;gap:8px;align-items:center}
.xnum{font:500 14px/20px var(--font-plain);color:var(--md-on-surface-variant);text-align:right;font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:64px minmax(0,1fr) 140px;gap:8px}
.trow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.goal-list{display:flex;flex-direction:column;gap:12px}
.echo{display:block;font:400 14px/20px var(--font-plain);color:var(--md-on-surface-variant)}
.echo b{font-weight:600;color:var(--md-on-surface)}

/* CBT triangle */
.tri{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:8px;align-items:center}
.tri-top{grid-column:1/-1;justify-self:center;width:min(100%,420px)}
.tri-c{color:var(--md-primary);display:grid;place-items:center}
.tri-c1{grid-column:1;transform:rotate(-45deg)}
.tri-c2{grid-column:3;transform:rotate(45deg)}
/* core belief diagram */
.core{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.core-c{grid-column:1/-1;justify-self:center;width:min(100%,460px)}
.core .core-c{background:var(--md-primary-container)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font:400 14px/20px var(--font-plain);font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--md-on-surface-variant);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--md-outline-variant);white-space:nowrap}
.tbl td{padding:8px 12px 8px 0;border-bottom:1px solid var(--md-outline-variant)}
.tbl .num{text-align:right;padding-right:0;padding-left:12px}
.empty{font:400 14px/20px var(--font-plain);color:var(--md-on-surface-variant)}

/* ---------- Home ---------- */
.hero{display:flex;gap:20px;align-items:center;padding-block:8px 8px}
.hero .appicon{width:88px;height:88px}
.hero h1{font:400 45px/52px var(--font-brand);letter-spacing:0;text-wrap:balance}
.hero p{font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant);max-width:62ch;margin-top:6px}
.ov{flex-direction:row;flex-wrap:wrap;align-items:center;gap:16px 40px}
.ov-n{font:400 28px/36px var(--font-brand);font-variant-numeric:tabular-nums}
.ov-l{font:500 12px/16px var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant)}
.ov-act{margin-left:auto}
.ov .lin{flex:1 1 100%}
.sec-h{font:400 24px/32px var(--font-brand);letter-spacing:0;margin-top:8px}
.wk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.wk{position:relative;border:0;text-align:left;cursor:pointer;background:var(--md-surface-container-low);color:var(--md-on-surface);border-radius:var(--shape-md);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--elev-1);transition:box-shadow .2s;min-width:0}
.wk:hover{box-shadow:var(--elev-2)}
.wk.cur{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.wk-top>.ms{color:var(--md-primary)}
.wk.cur .wk-top>.ms{color:inherit}
.wk-st{font:500 11px/16px var(--font-plain);letter-spacing:.5px;padding:2px 8px;border-radius:var(--shape-sm);border:1px solid var(--md-outline-variant);color:var(--md-on-surface-variant);white-space:nowrap}
.wk-st.go{border-color:transparent;background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.wk-st.ok{border-color:transparent;background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.wk-e{font:500 12px/16px var(--font-plain);letter-spacing:1px;text-transform:uppercase;opacity:.75}
.wk-t{font:400 18px/24px var(--font-brand);letter-spacing:0;text-wrap:balance}
.wk-s{font:400 14px/20px var(--font-plain);opacity:.8;flex:1}
.wk .lin{margin-top:8px}
.wk.cur .lin{background:color-mix(in srgb,var(--md-on-primary-container) 16%,transparent)}
.wk-m{font:500 12px/16px var(--font-plain);letter-spacing:.5px;opacity:.75;font-variant-numeric:tabular-nums}
.orph dt{font:500 14px/20px var(--font-plain)}
.orph dd{margin:2px 0 12px;font:400 14px/20px var(--font-plain);color:var(--md-on-surface-variant);white-space:pre-wrap;overflow-wrap:anywhere}


/* ---------- Settings-driven look ---------- */
:root[data-text="s"]{--fs:14px;--lh:20px}
:root[data-text="l"]{--fs:18px;--lh:28px}
:root[data-head="sans"]{--font-brand:var(--font-plain)}
:root[data-density="compact"]{--pad:14px;--gap:14px;--stack:10px}
:root[data-shape="sharp"]{--shape-xs:2px;--shape-sm:4px;--shape-md:4px;--shape-lg:6px;--shape-xl:8px;--shape-full:6px}
:root[data-motion="off"] *{transition:none!important;scroll-behavior:auto!important}

/* ---------- Home: today ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--stack);align-items:start}
.today-grid.one{grid-template-columns:minmax(0,1fr)}
.cq{container-type:inline-size;min-width:0}
.ql{display:grid;grid-template-columns:88px minmax(0,1fr) 92px 92px auto;gap:8px;align-items:end}
.qt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:end}
.ql .af>span,.qt .af>span{display:block}
@container (max-width:520px){
  .ql{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ql .ql-act{grid-column:1/-1;grid-row:1}
  .ql .btn,.qt .btn{grid-column:1/-1}
  .qt{grid-template-columns:minmax(0,1fr)}
}
.check small{display:block;font:400 14px/20px var(--font-plain);letter-spacing:.25px;color:var(--md-on-surface-variant)}
.mini-h{font:500 12px/16px var(--font-plain);letter-spacing:1px;text-transform:uppercase;color:var(--md-on-surface-variant);margin-bottom:4px}
button.chip-in{background:none;cursor:pointer;color:var(--md-on-surface);font-family:var(--font-plain)}
button.chip-in:hover{background:color-mix(in srgb,var(--md-on-surface) 8%,transparent)}
button.chip-in .ms{color:var(--md-primary)}
button.chip-in{padding-left:8px}

/* ---------- Settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.set-row+.set-row{padding-top:var(--gap);border-top:1px solid var(--md-outline-variant)}
.set-l{flex:1 1 220px;min-width:0}
.set-l b{display:block;font:400 16px/24px var(--font-plain);letter-spacing:.5px}
.set-l span{display:block;font:400 14px/20px var(--font-plain);color:var(--md-on-surface-variant)}
.seg.wide label>span{padding:0 16px}
.switch{position:relative;display:inline-flex;cursor:pointer;flex:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.sw-track{width:52px;height:32px;border-radius:16px;border:2px solid var(--md-outline);background:var(--md-surface-container-highest);display:flex;align-items:center;padding:0 6px;transition:background .15s,border-color .15s,padding .15s}
.sw-thumb{width:16px;height:16px;border-radius:50%;background:var(--md-outline);transition:transform .15s,width .15s,height .15s,background .15s}
.switch input:checked + .sw-track{background:var(--md-primary);border-color:var(--md-primary);padding:0 2px}
.switch input:checked + .sw-track .sw-thumb{width:24px;height:24px;background:var(--md-on-primary);transform:translateX(20px)}
.switch input:focus-visible + .sw-track{outline:2px solid var(--md-primary);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:8px 4px}
.swatch{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;width:68px;padding-top:5px;font:500 12px/16px var(--font-plain);letter-spacing:.5px;color:var(--md-on-surface-variant);text-align:center}
.swatch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.sw-dot{width:44px;height:44px;border-radius:50%;background:conic-gradient(from 90deg,var(--b) 0 25%,var(--c) 0 50%,var(--a) 0);outline:2px solid transparent;outline-offset:3px}
.swatch input:checked + .sw-dot{outline-color:var(--md-primary)}
.swatch input:checked ~ span:last-child{color:var(--md-on-surface);font-weight:700}
.swatch input:focus-visible + .sw-dot{outline-color:var(--md-on-surface)}

/* ---------- Sheet, dialog, snackbar ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--md-scrim) 40%,transparent)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:82%;overflow-y:auto;background:var(--md-surface-container-low);border-radius:var(--shape-xl) var(--shape-xl) 0 0;padding:0 8px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--elev-3)}
.sheet-handle{width:32px;height:4px;border-radius:2px;background:var(--md-on-surface-variant);opacity:.4;margin:16px auto 8px}
.sheet h2{font:400 22px/28px var(--font-brand);padding:8px 16px 8px}
.li{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;padding:8px 16px;border:0;background:none;text-align:left;cursor:pointer;border-radius:var(--shape-md);color:var(--md-on-surface)}
.li:hover{background:color-mix(in srgb,var(--md-on-surface) 8%,transparent)}
.li[aria-current="page"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.li>.ms{color:var(--md-on-surface-variant)}
.li-t{flex:1;min-width:0}
.li-t b{display:block;font:400 var(--fs)/var(--lh) var(--font-plain);letter-spacing:.5px}
.li-t span{display:block;font:400 14px/20px var(--font-plain);color:var(--md-on-surface-variant)}
.li-m{font:500 12px/16px var(--font-plain);color:var(--md-on-surface-variant);font-variant-numeric:tabular-nums}
.dialog{position:fixed;z-index:32;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 48px));max-height:80%;display:flex;flex-direction:column;gap:16px;background:var(--md-surface-container-high);border-radius:var(--shape-xl);padding:24px;box-shadow:var(--elev-3)}
.dialog h2{font:400 24px/32px var(--font-brand)}
.dialog textarea{flex:1;min-height:220px;width:100%;border:0;border-radius:var(--shape-sm);background:var(--md-surface-container-highest);color:var(--md-on-surface);font:400 14px/20px var(--font-plain);padding:12px;resize:none}
.snack{position:fixed;z-index:40;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--md-inverse-surface);color:var(--md-inverse-on-surface);border-radius:var(--shape-xs);padding:14px 16px;font:400 14px/20px var(--font-plain);box-shadow:var(--elev-3)}

/* ---------- Compact window (navigation bar) ---------- */
@media (max-width:599px){
  .rail{display:none}
  .navbar{display:block}
  .fab-ext{display:inline-flex}
  .content{padding-inline:16px;padding-block:4px calc(var(--bar-h) + 96px)}
  .topbar{padding-inline:16px 8px}
  .topbar .appicon{display:block}
  .save-state b{display:none}
  :root{--pad:16px}
  .ph h1{font-size:28px;line-height:36px}
  .hero{gap:16px;align-items:center}
  .hero .appicon{width:56px;height:56px}
  .hero h1{font-size:28px;line-height:36px}
  .hero p{display:none}
  .hero .eyebrow{letter-spacing:.5px}
  .ov-act{margin-left:0;flex:1 1 100%}
  .ov-act .btn{width:100%}
  .wk-s{display:none}
  .wk-t{font-size:16px;line-height:22px;flex:1}
  .wk{padding:12px}
  .arow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:6px;padding-bottom:12px;border-bottom:1px solid var(--md-outline-variant)}
  .arow .a-act{grid-column:1/-1;grid-row:1}
  .arow-h{display:none}
  .af>span{display:block}
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow-a .ms,.tri-c .ms{transform:rotate(90deg)}
  .prow{grid-template-columns:auto minmax(0,1fr)}
  .prow>.tf:last-child{grid-column:2}
  .tri{grid-template-columns:minmax(0,1fr)}
  .tri-top{width:100%}
  .tri-c1,.tri-c2{grid-column:1;transform:none}
  .tri-c2{display:none}
  .core{grid-template-columns:minmax(0,1fr)}
  .trow{grid-template-columns:64px minmax(0,1fr)}
  .trow .t-task{grid-column:1/-1;grid-row:1}
  .mood{grid-template-columns:minmax(0,1fr) auto}
  .mood label{grid-column:1/-1}
  .snack{bottom:calc(var(--bar-h) + 16px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:1099px){ .wk-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:959px){ .today-grid{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }

<script>
(function(){
'use strict';

/* ================= Storage (localStorage, key prefix cbt_) ================= */
const P = 'cbt_';
const mem = {};
const store = {
  get(id){
    if (id in mem) return mem[id];
    let v = '';
    try { v = localStorage.getItem(P + id) || ''; } catch(e) {}
    mem[id] = v;
    return v;
  },
  set(id, v){
    mem[id] = v;
    try { if (v === '') localStorage.removeItem(P + id); else localStorage.setItem(P + id, v); } catch(e) {}
  },
  keys(){
    const s = new Set(Object.keys(mem).filter(k => mem[k] !== ''));
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(P) === 0 && localStorage.getItem(k)) s.add(k.slice(P.length));
      }
    } catch(e) {}
    return Array.from(s);
  }
};

/* ================= Sync: per-answer timestamps, GitHub private repository ================= */
const SYNC_SKIP = k => k.indexOf('ui_') === 0 || k.indexOf('sync_') === 0;
const SYNC_FILE = 'retrain-your-brain.json';
const rawSet = store.set.bind(store);
let meta = {};
try { meta = JSON.parse(store.get('sync_meta') || '{}') || {}; } catch(e) { meta = {}; }
let cfg = null;
try { cfg = JSON.parse(store.get('sync_cfg') || 'null'); } catch(e) { cfg = null; }
let metaTimer = 0, syncTimer = 0, syncing = false, syncAgain = false, fileSha = null, lastSync = +store.get('sync_last') || 0;
let syncState = {s: '', msg: ''};
function saveMeta(){ rawSet('sync_meta', JSON.stringify(meta)); }
store.set = function(id, v){
  const prev = store.get(id);
  rawSet(id, v);
  if (prev !== v && !SYNC_SKIP(id)) {
    meta[id] = Date.now();
    clearTimeout(metaTimer); metaTimer = setTimeout(saveMeta, 300);
    syncSoon();
  }
};
/* every answer as [value, last-changed time]; answers written before sync existed count as time 1 */
function localData(){
  const out = {};
  store.keys().concat(Object.keys(meta)).forEach(k => { if (!SYNC_SKIP(k)) out[k] = [store.get(k), meta[k] || 1]; });
  return out;
}
/* newest change wins, answer by answer */
function merge(remote){
  const local = localData();
  let changed = 0, needPush = false;
  Object.keys(remote).forEach(k => {
    const r = remote[k];
    if (SYNC_SKIP(k) || !Array.isArray(r)) return;
    const rt = +r[1] || 0, l = local[k], lt = l ? l[1] : 0, rv = String(r[0] == null ? '' : r[0]);
    if (rt > lt) { if (!l || l[0] !== rv) { rawSet(k, rv); changed++; } meta[k] = rt; }
    else if (lt > rt) needPush = true;
  });
  Object.keys(local).forEach(k => { if (!(k in remote)) needPush = true; });
  saveMeta();
  return {changed: changed, needPush: needPush};
}
function refreshAll(){
  try { done = JSON.parse(store.get('done_sections') || '{}') || {}; } catch(e) { done = {}; }
  Object.keys(LISTS).forEach(name => { const L = LISTS[name], target = maxIndex(L.re); while (L.count < target) addEntry(name, false); });
  for (let n = 1; n <= LISTS.day.count; n++) {
    const need = maxIndex(new RegExp('^act-d' + n + 'r(\\d+)-'));
    while ((ROWS[n] || 0) < need) $(`act-day${n}-rows`).insertAdjacentHTML('beforeend', renderRow(n));
  }
  hydrate(document);
  for (let n = 1; n <= LISTS.day.count; n++) dayMeta(n);
  PAGES.forEach(p => renderFooter(p.key));
  updateBand(); updateAnx(); oldScale(); updateProgress(); renderOrphans();
  if (page === 'home' && !$('today').contains(document.activeElement)) renderToday();
  const s = $('page-' + page);
  if (s) { if (page !== 'home' && page !== 'settings') onShow(page); else resizeIn(s); }
}
const b64e = s => { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g, '')), c => c.charCodeAt(0)));
const ghHeaders = token => ({'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28'});
const ghRepo = c => `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
function ghError(status){
  if (status === 401) return 'GitHub rejected the token. It may be mistyped or expired; create a new one and connect again.';
  if (status === 403) return 'GitHub refused access. Check that the token has Contents set to Read and write for this repository.';
  if (status === 404) return 'Repository not found. Check the username and repository name, and that the token includes this repository.';
  return 'GitHub returned an error (' + status + '). Try again in a minute.';
}
const netError = e => (e instanceof TypeError) ? 'Could not reach GitHub. Check your internet connection.' : e.message;
function syncText(){
  const t = lastSync ? new Date(lastSync).toLocaleString([], {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}) : '';
  if (syncState.s === 'error') return syncState.msg;
  if (syncState.s === 'busy') return 'Syncing…';
  if (syncState.s === 'pending') return 'Changes waiting to sync…';
  return t ? 'Last synced ' + t : 'Not synced yet';
}
function setSyncState(s, msg){
  syncState = {s: s, msg: msg || ''};
  const top = {pending: ['cloud_upload', 'Saving…'], busy: ['sync', 'Syncing…'], ok: ['cloud_done', 'Synced'], error: ['cloud_off', 'Sync problem']}[s];
  const el = $('save-state');
  if (el && top) { el.innerHTML = I(top[0]) + '<b>' + top[1] + '</b>'; el.title = syncText(); }
  const st = $('sync-status');
  if (st) st.textContent = syncText();
}
function syncSoon(){
  if (!cfg || !window.CBT_HOSTED) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = 0; syncNow(); }, 8000);
  if (!syncing) setSyncState('pending');
}
async function syncNow(){
  if (!cfg || !cfg.token) return;
  if (syncing) { syncAgain = true; return; }
  clearTimeout(syncTimer); syncTimer = 0;
  syncing = true; setSyncState('busy');
  const url = ghRepo(cfg) + '/contents/' + SYNC_FILE;
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const res = await fetch(url, {headers: ghHeaders(cfg.token), cache: 'no-store'});
      let remote = {};
      if (res.status === 200) {
        const j = await res.json();
        fileSha = j.sha;
        try { remote = (JSON.parse(b64d(j.content || '')) || {}).data || {}; } catch(e) { remote = {}; }
      } else if (res.status === 404) fileSha = null;
      else throw new Error(ghError(res.status));
      const m = merge(remote);
      if (m.changed) refreshAll();
      if (!m.needPush) break;
      const payload = {app: 'retrain-your-brain', v: 1, updated: new Date().toISOString(), data: localData()};
      const bodyOut = {message: 'Sync answers', content: b64e(JSON.stringify(payload))};
      if (fileSha) bodyOut.sha = fileSha;
      const put = await fetch(url, {method: 'PUT', headers: ghHeaders(cfg.token), body: JSON.stringify(bodyOut)});
      if (put.status === 200 || put.status === 201) { fileSha = ((await put.json()).content || {}).sha || null; break; }
      if (put.status !== 409 && put.status !== 422) throw new Error(ghError(put.status));
      if (attempt === 2) throw new Error('Another device was saving at the same time. Sync will try again shortly.');
    }
    lastSync = Date.now(); rawSet('sync_last', String(lastSync));
    setSyncState(syncTimer ? 'pending' : 'ok');
  } catch(e) { setSyncState('error', netError(e)); }
  syncing = false;
  if (syncAgain) { syncAgain = false; syncSoon(); }
}
async function syncConnect(){
  let owner = $('sync-owner').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/^@/, ''), repo = $('sync-repo').value.trim().replace(/^https?:\/\/github\.com\//, '');
  const token = $('sync-token').value.trim(), msg = $('sync-msg');
  if (owner.indexOf('/') > 0) { const p = owner.split('/'); owner = p[0]; if (!repo) repo = p[1]; }
  if (repo.indexOf('/') > 0) repo = repo.split('/').filter(Boolean).pop();
  repo = repo.replace(/\.git$/, '');
  if (!owner || !repo || !token) { msg.textContent = 'Fill in all three fields.'; return; }
  msg.textContent = 'Checking with GitHub…';
  try {
    const c = {owner: owner, repo: repo, token: token};
    const res = await fetch(ghRepo(c), {headers: ghHeaders(token), cache: 'no-store'});
    if (res.status !== 200) throw new Error(ghError(res.status));
    const j = await res.json();
    if (j.private === false) throw new Error('That repository is public. Use a private one so your answers stay private.');
    cfg = c; rawSet('sync_cfg', JSON.stringify(cfg));
    renderSync();
    await syncNow();
    if (syncState.s === 'ok') snack('Connected. This device is now syncing.');
  } catch(e) { msg.textContent = netError(e); }
}
function syncOff(){
  cfg = null; rawSet('sync_cfg', ''); clearTimeout(syncTimer); syncTimer = 0; fileSha = null;
  $('save-state').innerHTML = '';
  renderSync();
  snack('This device is disconnected. Your answers stay here and in your repository.');
}
function rawTf(id, label, type){
  return `<div class="tf"><input id="${id}" type="${type || 'text'}" placeholder=" " autocomplete="off" autocapitalize="off" spellcheck="false"><label for="${id}">${esc(label)}</label></div>`;
}
function renderSync(){
  const el = $('sync-body');
  if (!el) return;
  if (!window.CBT_HOSTED) {
    el.innerHTML = body('Sync runs in the copy of this app hosted on your GitHub. This Claude version can’t reach GitHub, so answers written here stay in this browser. To move them across, use <b>Copy backup</b> below, then <b>Import</b> in the hosted app.');
  } else if (cfg) {
    el.innerHTML = setRow(`Connected to ${esc(cfg.owner)}/${esc(cfg.repo)}`, `<span id="sync-status">${esc(syncText())}</span>`, `<div class="btn-row">${btn('tonal', 'sync', 'Sync now', 'data-act="syncNow"')}${btn('text', '', 'Disconnect this device', 'data-act="syncOff"')}</div>`)
      + body(`Your answers are kept in the file <b>${SYNC_FILE}</b> in that repository and are checked when the app opens, a few seconds after you stop typing, and every two minutes. The newest change to each answer wins. Theme and other settings stay per device.`);
  } else {
    el.innerHTML = body('Keep your answers in a private GitHub repository of your own, so every device that opens this page shows the same thing. You need a private repository and an access token limited to it.')
      + `<div class="cols2">${rawTf('sync-owner', 'GitHub username')}${rawTf('sync-repo', 'Private repository name')}</div>`
      + rawTf('sync-token', 'Access token', 'password')
      + `<p class="empty" id="sync-msg" role="status"></p>`
      + `<div class="btn-row">${btn('filled', 'cloud_sync', 'Connect', 'data-act="syncConnect"')}</div>`
      + note('info', 'The token is stored only in this browser, and is sent only to GitHub. Enter it once on each device.');
  }
}
function backupCopy(){
  copyText(JSON.stringify({app: 'retrain-your-brain', v: 1, exported: new Date().toISOString(), data: localData()}), 'Backup copied. Paste it into Import in the other copy of the app.');
}
function backupImport(){
  let j = null;
  try { j = JSON.parse($('backup-in').value.trim()); } catch(e) { j = null; }
  if (!j || j.app !== 'retrain-your-brain' || !j.data || typeof j.data !== 'object') { snack('That doesn’t look like a backup from this app. Paste the whole text from Copy backup.'); return; }
  const m = merge(j.data);
  refreshAll();
  $('backup-in').value = '';
  snack(m.changed ? `Imported. ${m.changed} ${m.changed === 1 ? 'answer was' : 'answers were'} added or updated.` : 'Nothing new to import; this device already has everything in that backup.');
  syncSoon();
}
function initSync(){
  renderSync();
  if (!window.CBT_HOSTED) return;
  if (cfg) syncNow();
  document.addEventListener('visibilitychange', () => {
    if (!cfg) return;
    if (document.visibilityState === 'hidden') { if (syncTimer) syncNow(); }
    else if (Date.now() - lastSync > 30000) syncNow();
  });
  setInterval(() => { if (cfg && document.visibilityState === 'visible' && Date.now() - lastSync > 110000) syncNow(); }, 120000);
}

function maxIndex(re){
  let m = 0;
  store.keys().forEach(k => { const r = re.exec(k); if (r) m = Math.max(m, +r[1]); });
  return m;
}

/* ================= Small helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s).replace(/<[^>]+>/g, '');
const I = (name, cls) => `<span class="ms${cls ? ' ' + cls : ''}" aria-hidden="true">${name}</span>`;

let CUR = null;                 // page being built (for progress registration)
const REQ = {};                 // page key -> ids that count toward progress
const GROUPS = {};              // page key -> [() => [done, total]]
function reg(id, opt){ if (CUR && !opt) (REQ[CUR] = REQ[CUR] || []).push(id); }

/* ================= Component builders ================= */
function ta(id, label, o){
  o = o || {}; reg(id, o.opt);
  return `<div class="tf${o.cls ? ' ' + o.cls : ''}"><textarea id="${id}" data-save data-q="${esc(o.q || label)}" rows="${o.rows || 3}" placeholder=" "></textarea><label for="${id}">${esc(label)}</label></div>`;
}
function tf(id, label, o){
  o = o || {}; reg(id, o.opt);
  const num = o.type === 'number' ? ` inputmode="numeric" min="${o.min}" max="${o.max}"` : '';
  return `<div class="tf${o.cls ? ' ' + o.cls : ''}"><input id="${id}" type="${o.type || 'text'}"${num} data-save data-q="${esc(o.q || label)}" placeholder=" " autocomplete="off"><label for="${id}">${esc(label)}</label></div>`;
}
function cf(id, ph, o){
  o = o || {};
  const num = o.type === 'number' ? ` inputmode="numeric" min="0" max="${o.max || 10}"` : '';
  const input = `<input class="cf" id="${id}" type="${o.type || 'text'}"${num} data-save data-q="${esc(o.q || ph)}" placeholder="${esc(ph)}" aria-label="${esc(o.q || ph)}" autocomplete="off">`;
  if (o.cap) return `<label class="af${o.cls ? ' ' + o.cls : ''}"><span>${esc(o.cap)}</span>${input}</label>`;
  return o.cls ? `<div class="${o.cls}">${input}</div>` : input;
}
function q(id, prompt, o){
  o = o || {};
  return `<div class="q"><p class="prompt">${prompt}</p>${ta(id, o.label || 'Your response', Object.assign({}, o, {q: strip(prompt)}))}</div>`;
}
function body(t){ return `<p class="body">${t}</p>`; }
function card(title, icon, inner, o){
  o = o || {};
  return `<section class="card${o.cls ? ' ' + o.cls : ''}"${o.id ? ` id="${o.id}"` : ''}><header class="card-h"><span class="card-ic">${I(icon)}</span><div><h2>${title}</h2>${o.sub ? `<p class="card-sub">${o.sub}</p>` : ''}</div></header><div class="card-b">${inner}</div></section>`;
}
function sub(icon, title, inner){ return `<div class="subsec"><h3 class="sub-h">${I(icon)}<span>${title}</span></h3>${inner}</div>`; }
function note(icon, html, tone){ return `<div class="note${tone ? ' ' + tone : ''}">${I(icon)}<div>${html}</div></div>`; }
function acc(title, inner){ return `<details class="acc"><summary><span>${title}</span>${I('keyboard_arrow_down')}</summary><div class="acc-b">${inner}</div></details>`; }
function steps(items){ return `<ol class="steps">${items.map(t => `<li>${t}</li>`).join('')}</ol>`; }
function ticks(items){ return `<ul class="plain-list">${items.map(t => `<li>${I('check')}<span>${t}</span></li>`).join('')}</ul>`; }
function cb(id, text, bare){
  return `<label class="check${bare ? ' bare' : ''}"><input type="checkbox" id="${id}" data-save data-q="${esc(strip(text))}"${bare ? ` aria-label="${esc(text)}"` : ''}><span class="box">${I('check')}</span>${bare ? '' : `<span>${text}</span>`}</label>`;
}
function chip(id, text){
  return `<label class="chip"><input type="checkbox" id="${id}" data-save data-q="${esc(text)}"><span class="chip-in">${I('check')}<span>${esc(text)}</span></span></label>`;
}
function seg(id, values, label){
  return `<div class="seg" role="radiogroup" aria-label="${esc(label)}">${values.map(v => `<label><input type="radio" name="${id}" value="${v}" data-radio="${id}" data-q="${esc(label)}"><span>${I('check')}${v}</span></label>`).join('')}</div>`;
}
function btn(kind, icon, label, attrs){ return `<button class="btn ${kind}${icon ? ' has-ic' : ''}" ${attrs}>${icon ? I(icon) : ''}${label}</button>`; }
function actPlan(prefix, n){
  let h = '<div class="plan-rows">';
  for (let i = 1; i <= n; i++) {
    h += `<div class="prow">${cb(`${prefix}${i}-done`, `Activity ${i} done`, true)}${tf(`${prefix}${i}`, `Activity ${i}`)}${tf(`${prefix}${i}-when`, 'Day and time', {opt: true, q: `Activity ${i}, day and time`})}</div>`;
  }
  return h + '</div>';
}
const PLAN = {};
const WEEK_ACTS = {week2: ['w2-activity', 3], week3: ['w3-plan', 4], week4: ['w4-plan', 5], week5: ['w5-plan', 5]};
function planCard(wk, items, next){

    `<div class="checks">${items.map((t, i) => cb(`${wk}-todo${i + 1}`, t)).join('')}</div>${next ? tf(`${wk}-next`, next, {opt: true}) : ''}`,
    {cls: 'outlined', sub: 'For the week ahead. Tick these off as you go.'});
}

const ROWS = {};
function renderRow(n){
  const r = ROWS[n] = (ROWS[n] || 0) + 1, p = `act-d${n}r${r}`;
  return `<div class="arow">`
    + cf(p + '-time', '8 am', {cap: 'Time', cls: 'a-time', q: `Day ${n}, row ${r}: time`})
    + cf(p + '-act', 'What you did', {cap: 'Activity', cls: 'a-act', q: `Day ${n}, row ${r}: activity`})
    + cf(p + '-enj', '0–10', {type: 'number', cap: 'Enjoyment', cls: 'a-enj', q: `Day ${n}, row ${r}: enjoyment (0–10)`})
    + cf(p + '-imp', '0–10', {type: 'number', cap: 'Importance', cls: 'a-imp', q: `Day ${n}, row ${r}: importance (0–10)`})
    + `</div>`;
}
function renderDay(n){
  const rows = Math.max(3, maxIndex(new RegExp('^act-d' + n + 'r(\\d+)-')));
  ROWS[n] = 0;
  let r = '';
  for (let i = 0; i < rows; i++) r += renderRow(n);
  return `<details class="entry" id="day-${n}"${n === 1 ? ' open' : ''}><summary><span>Day ${n}</span><span class="entry-m" id="day-${n}-meta"></span>${I('keyboard_arrow_down')}</summary><div class="entry-b">`
    + tf(`act-day${n}-date`, 'Date', {q: `Day ${n}: date`})
    + `<div class="arows"><div class="arow arow-h" aria-hidden="true"><span>Time</span><span>Activity</span><span>Enjoyment</span><span>Importance</span></div><div class="arows" id="act-day${n}-rows">${r}</div></div>`
    + `<div>${btn('text', 'add', 'Add an hour', `data-addrow="${n}"`)}</div>`
    + `<div class="mood"><label for="act-day${n}-mood">Overall mood for the day</label><input type="range" min="0" max="10" step="1" id="act-day${n}-mood" data-save data-q="Day ${n}: overall mood (0–10)"><output id="act-day${n}-mood-out" for="act-day${n}-mood">Not rated</output></div>`
    + `</div></details>`;
}
function renderThought(n){
  return `<div class="entry-flat"><div class="entry-t">Entry ${n}</div><div class="flow">`
    + ta(`th${n}-sit`, 'Event', {rows: 2, q: `Entry ${n}: event`})
    + `<span class="flow-a">${I('arrow_forward')}</span>`
    + ta(`th${n}-thought`, 'Thought(s)', {rows: 2, q: `Entry ${n}: thought(s)`})

}
function renderChallenge(n){
  return `<div class="entry-flat"><div class="entry-t">Record ${n}</div>`
    + ta(`ch${n}-thought`, 'Thought', {rows: 2, q: `Record ${n}: thought`})
    + `<div class="cols2">${ta(`ch${n}-for`, 'Evidence for my thought', {q: `Record ${n}: evidence for`})}${ta(`ch${n}-against`, 'Evidence against my thought', {q: `Record ${n}: evidence against`})}</div>`
    + ta(`ch${n}-accuracy`, 'How accurate is the thought, given the evidence?', {rows: 2, q: `Record ${n}: how accurate is the thought`})
    + tf(`ch${n}-distortion`, 'Kind of thinking error, if any', {q: `Record ${n}: kind of thinking error`})
    + ta(`ch${n}-balanced`, 'A more reality-based thought', {rows: 2, q: `Record ${n}: a more reality-based thought`})

}
function renderExp(n){

}
function renderTask(n){

    + cf(`tk${n}-order`, 'Order', {type: 'number', max: 99, q: `Task ${n}: order`})

    + `<div class="trow2">${cf(`tk${n}-when`, 'Scheduled for (day and time)', {q: `Task ${n}: scheduled for`})}${cb(`tk${n}-done`, 'Done')}</div></div>`;
}
function renderWp(n){
  return `<div class="entry-flat">${tf(`wp${n}-name`, `What keeps me well, ${n}`, {q: `Wellness plan ${n}`})}${ta(`wp${n}-notes`, 'Reminders to myself', {rows: 2, q: `Wellness plan ${n}: reminders`})}</div>`;
}
function renderVal(a){
  return n => `<div class="vrow">${cf(`w2a-${a.k}${n}-text`, 'Activity', {q: `${a.name}: activity ${n}`})}${seg(`w2a-${a.k}${n}-diff`, [1, 2, 3], `${a.name}: activity ${n}, difficulty`)}</div>`;
}
const any = (prefix, fields) => n => fields.some(f => store.get(`${prefix}${n}-${f}`).trim());
const LISTS = {
  day: {box: 'activity-days', re: /^act-d(?:ay)?(\d+)[r-]/, min: 4, render: renderDay,
        filled: n => { if (store.get(`act-day${n}-date`).trim()) return true; for (let r = 1; r <= (ROWS[n] || 0); r++) if (store.get(`act-d${n}r${r}-act`).trim()) return true; return false; }},
  th:  {box: 'thought-log', re: /^th(\d+)-/, min: 3, render: renderThought, filled: any('th', ['sit', 'thought', 'emo'])},
  ch:  {box: 'challenge-log', re: /^ch(\d+)-/, min: 3, render: renderChallenge, filled: any('ch', ['thought', 'for', 'against', 'balanced'])},
  exp: {box: 'exposure-list', re: /^exp(\d+)-/, min: 5, render: renderExp, filled: any('exp', ['desc'])},
  tk:  {box: 'task-list', re: /^tk(\d+)-/, min: 3, render: renderTask, filled: any('tk', ['task'])},
  wp:  {box: 'wellness-plan', re: /^wp(\d+)-/, min: 3, render: renderWp, filled: any('wp', ['name', 'notes'])}
};
AREAS.forEach(a => {
  LISTS['w2a-' + a.k] = {box: 'w2a-' + a.k, re: new RegExp('^w2a-' + a.k + '(\\d+)-'), min: 2, render: renderVal(a), filled: any('w2a-' + a.k, ['text'])};
});
function countFilled(name){
  const L = LISTS[name]; let c = 0;
  for (let n = 1; n <= L.count; n++) if (L.filled(n)) c++;
  return c;
}
function addEntry(name, focus){
  const L = LISTS[name], box = $(L.box);
  const n = ++L.count;
  box.insertAdjacentHTML('beforeend', L.render(n));
  const el = box.lastElementChild;
  hydrate(el);
  if (focus) {
    if (el.tagName === 'DETAILS') el.open = true;
    resizeIn(el);
    el.scrollIntoView({block: 'center'});
    const f = el.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=range]),textarea');
    if (f) f.focus({preventScroll: true});
  }
}
function addRow(n){
  const box = $(`act-day${n}-rows`);
  box.insertAdjacentHTML('beforeend', renderRow(n));
  const f = box.lastElementChild.querySelector('input');
  if (f) f.focus();
}
