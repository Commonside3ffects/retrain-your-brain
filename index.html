      body('Keep a careful record of how you spend your days. Each row is an hour: write what you did, then rate how much you enjoyed it and how important it was to you, from 0 to 10. Those ratings are yours alone to make. Then rate your overall mood for the day, where 0 is very bad and 10 is very good.')
    + note('schedule', 'Complete the form for <b>four days</b> this week, and fill it in the same day. If you wait until the next day you’ll forget important information.')
    + `<div class="entries" id="activity-days"></div>`
    + `<div>${btn('tonal', 'add', 'Add a day', 'data-add="day"')}</div>`,
    {id: 'log-w1'})
  + checkIn('w1-checkin', 'The work you’ve done this week has clarified how anxiety and depression are affecting your life and what changes you want to make. Take a few minutes to write down your thoughts, feelings, and any concerns you may have.')
  + planCard('w1', ['Review your goal list several times.', 'Plan a specific time to do week 2.', 'Complete the Daily Activities form for four days.'], 'When I’ll do week 2');
}

function buildW2(){
  return card('Review your daily activities', 'find_in_page',
      `<div data-logsum></div>`
    + q('w2-review', 'Spend some time reviewing your Daily Activities form from the past week. How often are you doing activities that feel enjoyable and important to you? Are there gaps when you aren’t doing much of anything? Or is practically every moment crammed with activity, with no time left to enjoy living?', {label: 'Observations and feelings', rows: 4}))
  + card('Values and activities', 'spa',
      body('Write some of your values under each life area, then the activities that fall under each value. <b>Values</b> have no endpoint, and they don’t have to be heavy: anything that makes your life better counts. <b>Activities</b> are specific, with a beginning and an end, so you’ll know when you’ve done them. For example, the value “beautifying my living situation” might hold the activities “weed the front garden bed” and “buy cut flowers”.')
    + body('Then rate each activity for difficulty. <b>1</b> is something you’re probably doing already or could do without much trouble. <b>3</b> is hard to imagine tackling just yet. Give a <b>2</b> to those in between. You won’t finish this in one sitting; come back and add to it during the week.')
    + AREAS.map(a => sub(a.icon, a.name,
        ta('w2-val-' + a.k, 'Values', {rows: 2, q: a.name + ': values'})
      + `<div class="vrows" id="w2a-${a.k}"></div>`
      + `<div>${btn('text', 'add', 'Add an activity', `data-add="w2a-${a.k}"`)}</div>`)).join(''))
  + card('Where to begin', 'playlist_add_check',
      body('You’ll work through the 1s first. For this week, pick three of the easiest activities that interest you the most, ideally from different life areas. Write down which day you’ll do each one.')
    + actPlan('w2-activity', 3)
    + note('calendar_month', 'Write each activity into a blank Daily Activities form in the block of time when you plan to do it, and keep logging on those days.'))
  + card('Raising the odds', 'trending_up',
      body('Think carefully about what might get in the way of each activity. You’re most likely to complete your planned activities when you:')
    + steps(['Make each activity specific and manageable. Any small step in the right direction beats a big step not taken.', 'Make each activity enjoyable and/or important.', 'Plan a specific time for each activity, and protect that time.', 'Build accountability into your plan, even if it’s just telling someone what you’re going to do.'])
    + q('w2-odds', 'Add any other factors you know are helpful to you, for example focusing on one task at a time to keep from feeling overwhelmed.', {opt: true, rows: 2}))
  + checkIn('w2-checkin', 'Reflect on what stands out to you from this week’s work. What are the major takeaways? Was there anything that wasn’t quite clear, which you’ll need more time to think about? Note how you’re feeling right now and as you look to the week ahead.')
  + planCard('w2', ['Complete your three activities at the scheduled times.', 'Keep recording your daily activities on the days of your scheduled activities.', 'Finish the Values and Activities form you started.'], 'When I’ll do week 3');
}

function reviewActs(srcPrefix, n, ids){
  let h = '';
  for (let i = 1; i <= n; i++) h += `<div class="q"><span class="echo" data-echo="${srcPrefix}${i}" data-echo-label="Activity ${i}"></span>${ta(ids[i - 1], `Activity ${i}: how it went`, {rows: 2})}</div>`;
  return h;
}
function buildW3(){
  return card('Review last week’s activities', 'find_in_page',
      body('Take a moment to review how your three activities went. What went well? What could have gone better?')
    + reviewActs('w2-activity', 3, ['w3-act1', 'w3-act2', 'w3-act3'])
    + q('w3-reflection', 'What are your thoughts and feelings about planning and completing specific activities so far?')
    + note('info', 'A common response at this point is “I did my activities, but I didn’t feel any better.” If that happened, well done: you stuck to your plan. Like the first workouts of an exercise regimen, the benefit takes a while to show. Keep going.'))
  + card('Four activities for this week', 'playlist_add_check',
      body('Last week you planned three. This week, pick four. You can repeat one from last week if you need to revisit it, but try to add some new ones. Stick with activities you ranked 1, unless you’re confident you can complete a 2.')
    + actPlan('w3-plan', 4))
  + card('Catch a thought', 'psychology',
      body('Many of our emotional reactions come from how we interpret what happens, yet the interpretation rarely announces itself. It feels like the event caused the emotion directly. It’s hard to evaluate a thought you don’t recognize as a thought, so this week is practice in noticing them.')
    + q('w3-event', 'Think about a recent situation in which you felt a surge of unpleasant emotion. Picture where you were and what was happening as vividly as possible. Briefly describe the event that led up to the change in mood, and the emotion(s) you felt.', {label: 'Event and emotions'})
    + q('w3-thoughts', 'Notice any thoughts you had at the time. Can you identify specific thoughts that could explain the resulting emotion?', {label: 'Thoughts'})
    + note('lightbulb', 'Thoughts can be about the past, the present, or the future, and they may come as an image or an impression instead of words. If you can’t pinpoint one, leave a placeholder. You’ll have plenty of chances to practice.'))
  + card('Identifying Thoughts form', 'account_tree',
      body('Over the coming week, pay attention to times your mood worsens. As close to the moment as you can, record what was happening, the thought(s) you had, and what you felt. Record <b>at least three</b> events.')
    + `<div class="entries" id="thought-log"></div>`
    + `<div>${btn('tonal', 'add', 'Add an entry', 'data-add="th"')}</div>`,
    {id: 'log-w3'})
  + card('Common themes', 'category',
      body('As you record your thoughts you’ll likely notice recurring themes, like a jukebox with only a few hits. The typical themes differ by condition. Skip the ones that don’t apply to you.')
    + `<div class="acc-group">`
    + acc('Specific phobia', q('w3-phobia', 'Think about any of your own fears, and a recent time your fear was triggered. Are you aware of any thought that came up that may have contributed to your fear? Record the event, the thoughts, and the emotions.', {opt: true}))
    + acc('Panic', q('w3-panic', 'Think about specific times you’ve had a panic attack. What triggered the attack? Did you interpret the trigger in a way that led to more fear and more panic?', {opt: true}))
    + acc('Social anxiety', q('w3-social', 'Think about a recent situation in which you feared others’ judgments. Can you identify thoughts about what might happen in this situation?', {opt: true}))
    + acc('Generalized anxiety', q('w3-gad', 'If you see yourself as someone who worries too much, think about a recent situation that triggered anxiety. What was the situation, and can you identify any thoughts that led to your distress?', {opt: true}))
    + acc('Fear of fear', q('w3-fearfear', 'Are there things you’re afraid of even though you know they aren’t dangerous? Think carefully about how you feel when confronted with the object or situation. Do you have any predictions about what will happen as a result of being terrified?', {opt: true}))
    + acc('Depression', q('w3-depr', 'Think of a recent time something really brought down your mood. What did you tell yourself about what happened? Record what happened and what thoughts you can recall.', {opt: true}))
    + `</div>`
    + note('adjust', '<b>Getting to the core.</b> Trace where your thoughts lead. Specific thoughts often flow from one central “core belief”, and smaller fears from one “core fear”. You may or may not have an inkling of yours yet. The records you keep this week will help you find it in week 4.'))
  + checkIn('w3-checkin', 'You began to figure out some of the thoughts that lead you to anxiety and depression. Treat any progress this week as a success. Take some time to think about how you’re feeling at this point. Write your thoughts and feelings, along with any questions.')
  + planCard('w3', ['Complete the four activities you planned for this week.', 'Complete the Identifying Thoughts form for at least three events.', 'Plan a time to return to complete week 4.'], 'When I’ll do week 4');
}

function buildW4(){
  return card('Review last week’s activities', 'find_in_page',
      `<span class="echo" data-echo-list="w3-plan" data-n="4" data-echo-label="Planned"></span>`
    + q('w4-review', 'You had four activities planned for the past week. Summarize what went well.')
    + q('w4-review-diff', 'Was anything different than you expected: any challenges you ran into, or pleasant surprises?')
    + q('w4-review-learn', 'What did you learn from these activities that you can apply in upcoming weeks?'))
  + card('Five activities for this week', 'playlist_add_check',
      body('Choose five activities from your list and schedule days and times for them. Choose from your more challenging activities (2s and 3s) if they seem doable. If you didn’t complete one last week and still believe it’s worth doing, break it into smaller tasks to raise the odds.')
    + actPlan('w4-plan', 5))
  + card('Review your thought records', 'psychology',
      q('w4-themes', 'Review the Identifying Thoughts records you kept over the past week. Do any themes stand out?')
    + q('w4-distortions', 'By paying attention to what your mind tells you, you may have noticed problems with your thoughts: not all of them 100 percent true, or gravitating toward negative interpretations even when others were possible. Record any such tendencies. If you didn’t notice any, don’t worry.')
    + q('w4-false', 'Think of a time when you thought or believed something that turned out to be verifiably false, and describe it.')
    + note('label', '<b>Names for thinking errors.</b> Irrational: the thought doesn’t make sense. Dysfunctional: it doesn’t serve us well. Biased: it attends only to one side. Distorted: it doesn’t reflect reality. These overlap; use whichever helps you spot your own.'))
  + card('Challenging Your Thoughts form', 'balance',
      body('Start with the event you found most upsetting. Record the evidence that supports your thought, then any evidence against it that suggests the thought doesn’t tell the whole story. Then revise the thought to fit the evidence. The goal isn’t to think happy thoughts; it’s an accurate judgment. Complete the form for <b>three</b> triggering events this week.')
    + steps(['Am I ignoring any evidence that would contradict my thoughts?', 'How likely is it that I’m seeing it as worse than it really is?', 'What would I say to someone I care about if they had this thought?'])
    + `<div class="entries" id="challenge-log"></div>`
    + `<div>${btn('tonal', 'add', 'Add a thought record', 'data-add="ch"')}</div>`,
    {id: 'log-w4'})
  + card('Is it a catastrophe?', 'warning',
      q('w4-catastrophe', 'Sometimes the error isn’t in what we predict but in how bad we think it would be. As you examine your thoughts, do you notice any emotional reactions that seem overblown given the thought you identified? Did you tell yourself that something you did was “awful”, or that it would be “unbearable” if your fear came true? Consider whether you told yourself something more that could be driving the reaction.'))
  + card('Common thinking errors', 'category',
      body('Answer the ones that apply to you.')
    + q('w4-err-depr', '<b>Depression.</b> Look for thoughts about yourself that are harsher than the facts support, and for thoughts that start with “I should”. Summarize any errors you’ve become aware of in your own thinking. What led you to recognize them as errors?', {opt: true})
    + q('w4-err-anx', '<b>Anxiety: how likely.</b> Consider the things that cause you a lot of anxiety. Did you identify any errors in your beliefs related to the things you’re afraid of?', {opt: true})
    + q('w4-err-cost', '<b>Anxiety: how bad.</b> Have you noticed that some of the things you’re afraid of happening might be more manageable than you thought?', {opt: true})
    + q('w4-err-fear', '<b>Fear of fear.</b> Did you discover errors in the way you think about your own fear? What led you to think that the thoughts are not correct?', {opt: true}))
  + card('Your core belief or fear', 'adjust',
      q('w4-core-themes', 'Based on what you’ve observed of your thoughts so far, what are the common themes and errors that emerge in your thought records?')
    + `<div class="q"><p class="prompt">Using these observations, complete the diagram as best you can: your core belief or fear in the middle, and the related thoughts that come from it and feed it.</p><div class="core">`
    + tf('w4-core-t1', 'Related thought', {opt: true, q: 'Related thought 1'}) + tf('w4-core-t2', 'Related thought', {opt: true, q: 'Related thought 2'})
    + tf('w4-core', 'Core belief or fear', {cls: 'core-c'})
    + tf('w4-core-t3', 'Related thought', {opt: true, q: 'Related thought 3'}) + tf('w4-core-t4', 'Related thought', {opt: true, q: 'Related thought 4'})
    + `</div></div>`)
  + checkIn('w4-checkin', 'You’re now more than halfway through this seven-week program. Take a few moments to reflect on how things are going so far. What seems to be going well? Where do you still find yourself struggling? Of the things you’ve worked on so far, which feel like they may be the most important for you?')
  + planCard('w4', ['Complete your five scheduled activities.', 'Complete a Challenging Your Thoughts form for three situations this week.', 'Plan a time to complete week 5.'], 'When I’ll do week 5');
}

function buildW5(){
  return card('Review last week', 'find_in_page',
      `<span class="echo" data-echo-list="w4-plan" data-n="5" data-echo-label="Planned"></span>`
    + q('w5-review', 'Review the list of five activities you planned to complete. How did they go? Record anything that stands out.')
    + q('w5-errors', 'Review the Challenging Your Thoughts forms you completed. Summarize the kinds of thinking errors, if any, you noticed. Did they cluster around a core theme?')
    + note('balance', `This week, complete at least one Challenging Your Thoughts form, and more if necessary. ${btn('text', '', 'Open the form in Week 4', 'data-go="week4" data-anchor="log-w4"')}`))
  + card('Five more activities', 'playlist_add_check',
      body('Choose five more activities from your list for the coming week. Don’t be afraid to challenge yourself with some of your hardest ones. There’s a good chance the more difficult activities are the more rewarding ones. As always, plan specific times in your calendar.')
    + actPlan('w5-plan', 5))
  + card('Your time and tasks', 'schedule',
      q('w5-effects', 'How have depression and/or anxiety affected your ability to complete tasks?')
    + q('w5-tm-well', 'Take a few moments to think about your own time management. What do you tend to do well in managing your time? What strategies work well for you?')
    + q('w5-tm-struggle', 'Are there also areas where you struggle with managing your time? Do you feel constantly rushed, or like everything you do takes too long? Is it hard to decide how best to spend your time? Do you find yourself putting things off as long as possible?'))
  + card('Four steps', 'format_list_numbered',
      body('The system rests on breaking big tasks into manageable parts.')
    + steps(['<b>Identify</b> your tasks: decide what you need to do.', '<b>Prioritize</b> your tasks: determine where to start, based on when things are due.', '<b>Plan</b> when to complete your tasks: assign a time on your calendar for each one.', '<b>Follow through</b>: no step is more important than doing what you set out to do.'])
    + q('w5-steps', 'Do you notice any steps that seem to give you particular trouble? For example, do you struggle to prioritize because everything seems important? Do you make a good plan and then struggle to complete it?')
    + note('calendar_month', 'Have your calendar on hand for the next section: one calendar with all your appointments in it, not separate ones for different parts of your life.'))
  + card('Task list', 'checklist',
      body('If you’ve been struggling to get things done, list what you need to accomplish in the next one to two weeks. Don’t break tasks down yet. Then write the date each one needs to be done, and number them in order, with 1 for the first that needs doing.')
    + body('Look at your first task. If it feels too big to start, divide it into subtasks and date each one, working backward from the due date. Finally, give every task a specific time on your calendar. If you can’t complete something as planned, move it to a new time.')
    + `<div class="entries" id="task-list"></div>`
    + `<div>${btn('tonal', 'add', 'Add a task', 'data-add="tk"')}</div>`
    + q('w5-list-feel', 'Take a moment to review your list. What stands out? How do you feel as you look it over?', {opt: true, rows: 2})
    + q('w5-approach', 'Take a few moments to reflect on the process so far. How are you feeling about this approach?', {rows: 2}),
    {id: 'log-w5'})
  + card('Setting yourself up to succeed', 'build',
      sub('view_agenda', 'Create manageable pieces',
        body('A ladder turns a ten-foot gap into a series of one-foot gaps. For any task, ask whether you have a clear idea of how to get started. If not, break it down further.')
      + tf('w5-project', 'A project I’ve been struggling to complete')
      + `<div class="cols2">${[1, 2, 3, 4, 5, 6].map(i => tf('w5-step' + i, 'Step ' + i, {opt: true})).join('')}</div>`)
    + sub('timer', 'Be realistic about timing', body('Plan for how long something is likely to take you, not how long it “should” take. If you underestimate, use that information the next time you schedule the task.'))
    + sub('alarm', 'Set alarms and reminders', body('Give every task a nearly foolproof reminder, and do the task immediately when the alarm goes off. If you can’t, set another reminder straight away.'))
    + sub('handshake', 'Build in accountability',
        q('w5-contact', 'When we’re behind, we often avoid the people we feel we’re letting down. Are there people in your own life you need to get in touch with whom you’ve been avoiding? List them, and write in your calendar when you’ll contact the ones you choose for this week.', {opt: true, rows: 2}))
    + sub('play_arrow', 'Decide to start',
        q('w5-start', 'Figuring out how to do a task is part of the task. Are there tasks you’ve delayed starting because you don’t know how to complete them? List them, and add the ones you want to start this week to your schedule.', {opt: true, rows: 2}))
    + sub('redeem', 'Reward yourself', body('Find small rewards for meeting a goal: a snack, a short break, time with someone. Avoid rewards that are hard to stop, and put the reward away once you’re back at work.'))
    + sub('desk', 'Make space',
        q('w5-space', 'Do you need to organize your work space to make it easier to get things done?', {opt: true, rows: 2})
      + q('w5-distract', 'What tends to distract you when you’re trying to be productive? Are there ways to remove the distractions from your environment?', {opt: true, rows: 2}))
    + sub('self_improvement', 'Practice acceptance',
        q('w5-accept', 'It will be difficult to follow your plan at times. That difficulty doesn’t mean you should abandon it. When you meet your edge and are tempted to avoid, what can you tell yourself to encourage acceptance of the inevitable discomfort?', {rows: 2}))
    + sub('checklist', 'Choose two or three to focus on this week',
        `<div class="chips">${STRATS.map(s => chip('w5-st-' + s[0], s[1])).join('')}</div>`))
  + card('Barriers and how to remove them', 'block',
      q('w5-procrast', '<b>I’m procrastinating.</b> Are there certain tasks you routinely put off? If so, what leads you to delay doing them? How do you feel while you’re procrastinating?')
    + q('w5-procrast-thought', 'Are you aware of anything you tell yourself about procrastinating that may not be accurate? If so, what could you tell yourself that would be helpful?')
    + note('info', '<b>I’m overwhelmed.</b> Treat your current task as if it’s the only thing you have to do, because while you’re doing it, it is. And ask the important question: does it all have to get done?')
    + q('w5-motivation', '<b>I have no motivation.</b> Breaking a task down takes your foot off the brake; small rewards engage the accelerator. What have you found increases your motivation to complete tasks?')
    + q('w5-misgivings', '<b>“I should just be able to do this.”</b> Do you notice any misgivings of your own about using these tools to help you get things done? Write down what you think it means if you rely on these kinds of strategies.'))
  + checkIn('w5-checkin', 'Take a few moments to consider how things are going for you now, five weeks into this program. What’s going well? Are there areas where you continue to struggle? Include any reactions to the material in this chapter.')
  + planCard('w5', ['Schedule and complete your five activities.', 'Complete at least one Challenging Your Thoughts form.', 'Complete the tasks you scheduled for this week.', 'Choose two to three strategies from this week to implement.', 'Plan a time to complete week 6.'], 'When I’ll do week 6');
}

function buildW6(){
  return card('Review last week', 'find_in_page',
      `<span class="echo" data-echo-list="w5-plan" data-n="5" data-echo-label="Planned"></span>`
    + q('w6-rev-act', 'Briefly review your successes and any challenges with your activities over the past week.')
    + note('calendar_month', `Keep completing activities from your list. If there are some 3s you haven’t gotten to, consider adding them. Also choose three days this week to log on the Daily Activities form. ${btn('text', '', 'Open the log in Week 1', 'data-go="week1" data-anchor="log-w1"')}`)
    + q('w6-rev-thoughts', 'In the past week, did you catch yourself thinking things that weren’t supported by facts? Record the kinds of thoughts you noticed and challenged.')
    + `<div class="q"><p class="prompt">By now you may be able to dismiss some thoughts without the full evidence exercise. It helps to have something to say in response. Find one that resonates with you:</p><div class="chips">${['“There go my thoughts.”', '“Okay, back to reality.”', '“Thank goodness that’s not true.”', '“Not everything you think is true.”'].map(t => `<span class="chip-in">${t}</span>`).join('')}</div></div>`
    + q('w6-rev-tasks', 'If you planned to complete some tasks using specific strategies for time and task management, how well did you follow the plan you laid out? Did anything go worse than expected, or better? If you struggled to stick to the plan, what got in the way?', {opt: true}))
  + card('Your fears', 'psychology_alt',
      q('w6-fears', 'Take a moment to think about your own fears. What are your main fears? Do these fears get in the way of living your life to the fullest?'))
  + card('Principles of facing fears', 'stairs',
      body('The most effective way to overcome a fear is to expose yourself to the situations that trigger it. That is why this approach is called exposure.')
    + sub('trending_down', 'Anxiety goes down',
        q('w6-diminished', 'When we face a scary situation and nothing bad happens, the brain learns something new about it. Think of a time you faced your fears and they diminished, and write about it.'))
    + sub('stairs', 'Make it progressive',
        q('w6-incremental', 'A good hierarchy is like a ladder with evenly spaced rungs. Think again about your own fears. What are some activities that would allow you to face them incrementally?'))
    + sub('ads_click', 'Do it on purpose',
        q('w6-unintended', 'Choosing to face a fear is more effective than facing it against your will. Consider times when you encountered the things you’re afraid of without trying to. How helpful was it in reducing your fear?'))
    + sub('repeat', 'Repeat as needed', body('Doing something one time is an act of courage, but it’s not therapy. The therapy comes from repeating the activity, close together in time, until it starts to feel more comfortable.'))
    + sub('hourglass_top', 'Stay through the discomfort',
        q('w6-fled', 'Stay in a situation long enough to learn something new. Are there situations you’ve fled because you had a spike in your anxiety? What do you think would have happened had you stayed?'))
    + sub('backpack', 'Eliminate unnecessary props',
        q('w6-props', 'Think about your own feared situations and things you might do to prevent what you’re afraid of from happening. Do any of these strike you as unnecessary safety behaviors that you could consider dropping?'))
    + sub('self_improvement', 'Embrace discomfort and uncertainty',
        q('w6-remind', '“I don’t know what will happen, and I’m willing to do it anyway.” Write what you’ll remind yourself of when tempted to pull back from facing uncertain or uncomfortable situations.'))
    + note('health_and_safety', '<b>Use common sense.</b> Facing fears helps only for things that aren’t truly dangerous. The activities you choose should present no more danger than normal day-to-day life.', 'tertiary'))
  + card('Tailoring exposure to your fears', 'tune',
      body('The principles hold for all kinds of anxiety, and each condition has its own adaptations. Open the ones that apply to you.')
    + `<div class="acc-group">`
    + acc('Specific phobias', q('w6-phobia', 'Exposures should let you test what you assume will happen when you meet the thing you fear. If you struggle with a phobia, what do you think will happen if you confront it? Keep these predictions in mind for your hierarchy.', {opt: true}))
    + acc('Panic',
        note('air', '<b>Keep breathing.</b> Five minutes a day: inhale slowly for a count of four, into the belly more than the chest. Exhale slowly for a count of four. Pause for a count of two to four. The point is to help you through an exposure, not to make sure you don’t panic.')
      + q('w6-panic-beliefs', 'What are some of the beliefs you have about what will happen if you panic? Have some of these fears been hard to counter by challenging your thoughts alone? Do you expect something bad to happen other than the panic itself?', {opt: true})
      + q('w6-panic-sens', 'Have you developed any fears of bodily sensations related to panic? Which sensations are uncomfortable for you, and what activities could produce them? For example: running hard for a minute for a pounding heart, ten fast deep breaths for hyperventilation, spinning in a swivel chair for dizziness.', {opt: true}))
    + acc('Social anxiety',
        q('w6-social-test', 'Consider a social situation you fear and what you’re afraid might happen when you confront it. How could you set up an exposure to test your predictions? Be specific about what you expect to see, so you don’t rely on a gut feeling afterwards.', {opt: true})
      + q('w6-social-safety', 'Can you identify any of your own safety behaviors in social situations? What do you think are the advantages of using these behaviors? The disadvantages?', {opt: true})
      + q('w6-social-attention', 'When you’re in uncomfortable social situations, how much of your attention is directed toward yourself and how you’re coming across, versus on the other person? If you find yourself focused on yourself, what effects have you noticed?', {opt: true}))
    + acc('Generalized anxiety and worry',
        q('w5-worry-topics', 'Do you find yourself repeatedly worrying about things? If so, list some of your recent worries.', {opt: true})

const pad2 = n => (n < 10 ? '0' : '') + n;
function todayIso(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayLabel(){ try { return new Date().toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}); } catch(e) { return todayIso(); } }
function hourLabel(){ try { return new Date().toLocaleTimeString([], {hour: 'numeric'}); } catch(e) { return ''; } }
function dayEmpty(n){ return !LISTS.day.filled(n) && store.get(`act-day${n}-mood`) === '' && !store.get(`act-day${n}-iso`); }
function todayDay(create){
  const iso = todayIso(), label = todayLabel().toLowerCase(), L = LISTS.day;
  for (let n = 1; n <= L.count; n++) if (store.get(`act-day${n}-iso`) === iso) return n;
  for (let n = 1; n <= L.count; n++) if (store.get(`act-day${n}-date`).trim().toLowerCase() === label) { store.set(`act-day${n}-iso`, iso); return n; }
  if (!create) return 0;
  let n = 0;
  for (let i = 1; i <= L.count; i++) if (dayEmpty(i)) { n = i; break; }
  if (!n) { addEntry('day', false); n = L.count; }
  store.set(`act-day${n}-iso`, iso);
  store.set(`act-day${n}-date`, todayLabel());
  hydrate($('day-' + n)); dayMeta(n);
  return n;
}
function quickLog(){

  if (!r) { $(`act-day${n}-rows`).insertAdjacentHTML('beforeend', renderRow(n)); r = ROWS[n]; }
  const rate = v => { const x = parseFloat(v); return isNaN(x) ? '' : String(Math.max(0, Math.min(10, Math.round(x)))); };
  store.set(`act-d${n}r${r}-time`, $('ql-time').value.trim());
  store.set(`act-d${n}r${r}-act`, act);
  store.set(`act-d${n}r${r}-enj`, rate($('ql-enj').value));

}

function updateProgress(){
  let D = 0, T = 0, nd = 0;

    $('pf-' + p.key).style.width = (done[p.key] ? 100 : r.pct) + '%';
    $('pm-' + p.key).textContent = `${r.d} of ${r.t} exercises`;

    st.className = 'wk-st' + (done[p.key] ? ' ok' : (r.d ? ' go' : ''));

  });

  const cur = document.querySelector('.navbar [data-nav="current"]');

  cur.querySelector('.ms').textContent = cw.icon;

}

function logSummary(){
  const avg = a => a.length ? (a.reduce((s, x) => s + x, 0) / a.length).toFixed(1) : '–';
  let rows = '';
  for (let n = 1; n <= LISTS.day.count; n++) {
    let acts = 0; const e = [], m = [];
    for (let r = 1; r <= (ROWS[n] || 0); r++) {
      if (store.get(`act-d${n}r${r}-act`).trim()) acts++;
      const a = parseFloat(store.get(`act-d${n}r${r}-enj`)), b = parseFloat(store.get(`act-d${n}r${r}-imp`));
      if (!isNaN(a)) e.push(a);
      if (!isNaN(b)) m.push(b);
    }
    const mood = store.get(`act-day${n}-mood`);
    if (!acts && mood === '') continue;
    rows += `<tr><td>${esc(store.get(`act-day${n}-date`).trim() || 'Day ' + n)}</td><td class="num">${acts}</td><td class="num">${avg(e)}</td><td class="num">${avg(m)}</td><td class="num">${mood === '' ? '–' : mood}</td></tr>`;
  }
  if (!rows) return `<p class="empty">Nothing logged in the Daily Activities form yet. Your days will be summarized here once you fill it in.</p>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Day</th><th class="num">Activities</th><th class="num">Avg enjoyment</th><th class="num">Avg importance</th><th class="num">Mood</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function pageText(key){
  const sec = $('page-' + key), p = BYKEY[key];
  const out = [`# ${p.eyebrow}: ${p.title}`];
  let lastCard = null, n = 0;
  sec.querySelectorAll('[data-save],[data-radio]').forEach(el => {
    let v;
    if (el.dataset.radio !== undefined) { if (!el.checked) return; v = el.value; }
    else if (el.type === 'checkbox') { if (!el.checked) return; v = 'Yes'; }
    else if (el.type === 'range') { v = store.get(el.id); }
    else v = el.value.trim();
    if (!v) return;
    const c = el.closest('.card');
    if (c && c !== lastCard) { lastCard = c; const h2 = c.querySelector('h2'); if (h2) out.push('\n## ' + h2.textContent); }
    out.push(`${el.dataset.q}\n> ${v.replace(/\n/g, '\n> ')}`);
    n++;
  });
  return n ? out.join('\n') : '';
}
function copyText(text, okMsg){
  if (!text) { snack('Nothing written here yet.'); return; }
  const fallback = () => { $('dialog-text').value = text; $('scrim').hidden = false; $('dialog').hidden = false; $('dialog-text').focus(); $('dialog-text').select(); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => snack(okMsg), fallback);
    else fallback();
  } catch(e) { fallback(); }
}

function sortExp(){
  const L = LISTS.exp, items = [];
  for (let n = 1; n <= L.count; n++) {
    const d = store.get(`exp${n}-desc`), l = store.get(`exp${n}-level`);
    if (d.trim() || l.trim()) items.push({d: d, l: l});
  }
  if (items.length < 2) { snack('Add at least two activities to sort.'); return; }
  items.sort((a, b) => (parseFloat(b.l) || 0) - (parseFloat(a.l) || 0));
  for (let n = 1; n <= L.count; n++) {
    const it = items[n - 1] || {d: '', l: ''};
    store.set(`exp${n}-desc`, it.d); store.set(`exp${n}-level`, it.l);
  }
  hydrate($(L.box));
  oldScale();
  snack('Sorted, hardest first.');
}

};
function onSave(t){
  if (onSetting(t)) { if (t.dataset.set === 'text' || t.dataset.set === 'density') { const s = $('page-' + page); if (s) resizeIn(s); } return; }
  if (t.dataset.mirror !== undefined) {
    const o = $(t.dataset.mirror);
    store.set(t.dataset.mirror, t.checked ? '1' : '');
    if (o) o.checked = t.checked;
    showSaved(); scheduleProgress();
    return;
  }
  if (t.dataset.todayMood !== undefined) {
    const n = todayDay(true), o = $(`act-day${n}-mood`);
    store.set(`act-day${n}-mood`, t.value);
    if (o) { o.value = t.value; moodOut(o); }
    dayMeta(n);
    $('today-mood-out').textContent = t.value + ' / 10';
    showSaved(); scheduleProgress();
    return;
  }
  if (t.dataset.radio !== undefined) { if (t.checked) store.set(t.dataset.radio, t.value); }
  else if (t.dataset.save !== undefined) store.set(t.id, t.type === 'checkbox' ? (t.checked ? '1' : '') : t.value);
  else return;
  const id = t.id || '';
  if (t.type === 'range') moodOut(t);
  if (id === 'i-depression-score') updateBand();
  if (id.indexOf('i-anx-') === 0) updateAnx();
  if (/^exp\d+-level$/.test(id)) oldScale();
  const m = /^act-day(\d+)-/.exec(id);
  if (m) dayMeta(+m[1]);
  showSaved();
  scheduleProgress();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName === 'TEXTAREA' && !t.dataset.fixed) autosize(t);
  onSave(t);
});
document.addEventListener('change', e => { if (e.target.type === 'checkbox' || e.target.type === 'radio') onSave(e.target); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-add],[data-addrow],[data-done],[data-undone],[data-act]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) { closeAll(); go(d.go, d.anchor); }
  else if (d.add) addEntry(d.add, true);
  else if (d.addrow) addRow(+d.addrow);
  else if (d.done) setDone(d.done, true);
  else if (d.undone) setDone(d.undone, false);
  else if (d.act && ACTS[d.act]) ACTS[d.act]();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'ql') quickLog();
  else if (e.target.id === 'qt') quickThought();
});
document.addEventListener('toggle', e => { if (e.target.open) resizeIn(e.target); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
$('main').addEventListener('scroll', () => { $('main').classList.toggle('scrolled', $('main').scrollTop > 4); }, {passive: true});
window.addEventListener('resize', () => { const s = $('page-' + page); if (s) resizeIn(s); });

/* ================= Start ================= */
function start(){
  applySettings();
  buildAll();
  Object.keys(LISTS).forEach(name => {
    const L = LISTS[name];
    L.count = 0;
    const target = Math.max(L.min, maxIndex(L.re));
    for (let i = 0; i < target; i++) addEntry(name, false);
  });
  hydrate(document);
  for (let n = 1; n <= LISTS.day.count; n++) dayMeta(n);
  PAGES.forEach(p => renderFooter(p.key));
  updateBand(); updateAnx(); oldScale();
  updateProgress();
  renderOrphans();
  let first = '';
  try { first = (location.hash || '').replace('#', ''); } catch(e) {}
  if (first !== 'home' && first !== 'settings' && !BYKEY[first]) first = store.get('ui_start') === 'home' ? 'home' : store.get('ui_page');
  go(first || 'home');
  initSync();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const s = $('page-' + page); if (s) resizeIn(s); });
}
start();
})();
</script>
